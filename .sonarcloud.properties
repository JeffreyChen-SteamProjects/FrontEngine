# SonarCloud 自動分析的設定 / Settings for SonarCloud automatic analysis.

# 翻譯字典裡同一個詞在不同的鍵底下重複出現是正常的：義大利文的「Velocità」既是
# 影片速度也是寵物速度，俄文的「Удалить」在好幾個對話框都是「移除」。把它們提成
# 常數只會讓字典更難讀、更難交給翻譯的人看——那正是這種檔案存在的理由。
#
# In a translation table the same word legitimately recurs under different
# keys: Italian "Velocità" is both video speed and pet speed, Russian
# "Удалить" is "remove" in several dialogs. Hoisting those into constants
# would make the tables harder to read and harder to hand to a translator,
# which is the one thing these files exist for.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=frontengine/utils/multi_language/**/*.py
