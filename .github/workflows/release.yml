name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version segment to bump"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # 發佈只在 `dev` 合併進 `main` 時發生。
    #
    # 以前是「任何 PR 合併進 main 就發佈」，於是每一個功能、每一次改文件都會多發
    # 一版：光是想把進度記錄檔的一行改掉，就得多推一個版本到 PyPI。功能現在累積
    # 在 dev 上，要發佈時才刻意開一個 dev -> main 的 PR。
    #
    # 萬一有人把功能分支直接對著 main 開 PR，合併照樣會成功，只是不會發佈——
    # 錯的方向是「少發一版」而不是「多發一版」，事後補一個 dev -> main 就好。
    # 手動 workflow_dispatch 保留，作為重跑失敗發佈的逃生口。
    #
    # Releases happen only when `dev` merges into `main`.
    #
    # Any merge to main used to publish, so every feature - and every
    # documentation fix - minted a version: changing one line of the progress
    # log would have cost a PyPI release. Features now collect on dev, and a
    # release is a deliberate dev -> main pull request.
    #
    # If a feature branch is aimed at main by mistake it still merges, it just
    # does not publish. The failure direction is a missing release rather than
    # an unwanted one, and opening dev -> main afterwards fixes it.
    # workflow_dispatch stays as the escape hatch for re-running a failed publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump version in stable.toml / pyproject.toml
        id: bump
        shell: bash
        env:
          BUMP_TYPE: ${{ inputs.bump || 'patch' }}
        run: |
          python - <<'PY'
          import os, pathlib, re

          bump_type = os.environ.get("BUMP_TYPE", "patch").lower()
          if bump_type not in {"patch", "minor", "major"}:
              raise SystemExit(f"Invalid bump type: {bump_type}")

          stable = pathlib.Path("stable.toml")
          text = stable.read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit("No semver version line found in stable.toml")
          major, minor, patch = (int(x) for x in match.groups())

          if bump_type == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump_type == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          new_version = f"{major}.{minor}.{patch}"

          stable.write_text(
              re.sub(
                  r'(^version\s*=\s*)"\d+\.\d+\.\d+"',
                  rf'\1"{new_version}"',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              ),
              encoding="utf-8",
          )

          pyproject = pathlib.Path("pyproject.toml")
          if pyproject.exists():
              pp_text = pyproject.read_text(encoding="utf-8")
              pyproject.write_text(
                  re.sub(
                      r'(^version\s*=\s*)"\d+\.\d+\.\d+"',
                      rf'\1"{new_version}"',
                      pp_text,
                      count=1,
                      flags=re.MULTILINE,
                  ),
                  encoding="utf-8",
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={new_version}\n")
              fh.write(f"tag=v{new_version}\n")
          print(f"::notice::Bumped to {new_version} ({bump_type})")
          PY

      - name: Check if tag already exists
        id: tag_check
        shell: bash
        run: |
          if git rev-parse "refs/tags/${{ steps.bump.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.bump.outputs.tag }} already exists — aborting to avoid republishing."
            exit 1
          fi

      # 推版本號會和「同時被合併的其他 PR」搶 main。之前五個 PR 在 36 秒內合併，
      # 這一步就被 `cannot lock ref 'refs/heads/main'` 打掉、整個發佈失敗。
      # main 被推走不是錯誤，是正常情況，rebase 後重試即可；rebase 真的衝突才算失敗。
      # Pushing the bump races with any PR merged at the same time. Five PRs
      # merged inside 36 seconds once killed this step with
      # `cannot lock ref 'refs/heads/main'` and failed the whole release.
      # main moving is normal, not an error: rebase and retry. Only a genuine
      # rebase conflict is a failure.
      - name: Commit version bump to main
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stable.toml pyproject.toml
          git commit -m "Bump version to ${{ steps.bump.outputs.version }} [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Pushed the version bump on attempt ${attempt}."
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "::error::Could not push the version bump after 5 attempts."
              exit 1
            fi
            echo "::notice::Push rejected - main moved. Rebasing and retrying."
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::Rebasing the version bump onto main conflicted."
              exit 1
            fi
            sleep 5
          done

          # 建置與打標籤都要用這個 SHA。rebase 之後 HEAD 會換，而且此時的工作目錄
          # 已包含期間合併進來的內容——產出的套件與標籤因此指向同一份程式碼。
          # The build and the tag both use this SHA. HEAD changes after a rebase,
          # and the tree now carries whatever was merged in the meantime, so the
          # published distribution and the tag describe the same code.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Swap in stable project metadata for build
        run: cp stable.toml pyproject.toml

      - name: Read project name
        id: meta
        shell: bash
        run: |
          NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      # 建置工具釘版本：發佈流程不該因為上游今天推了新版就跟著改行為。
      # Pin the build tooling: a publish must not change behaviour because an
      # upstream release happened to land today.
      - name: Install build tooling
        run: python -m pip install --upgrade pip "build==1.4.2" "twine==6.2.0"

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify distributions
        run: python -m twine check dist/*

      - name: Upload distributions artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.bump.outputs.version }}
          path: dist/
          retention-days: 90

      - name: Twine upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*

      # 標籤要綁在剛才推上去的那個 commit，不能綁 main。綁 main 的話，發佈期間又有
      # PR 合併進來，標籤就會落在後來的 commit 上——v1.0.58 就是這樣指到一個
      # 「不是 1.0.58 實際發佈內容」的 commit。
      # Tag the commit that was just pushed, not main. With `--target main`, a PR
      # merged while the release runs moves the tag onto a later commit: that is
      # how v1.0.58 ended up on a commit that is not what 1.0.58 shipped.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            dist/* \
            --title "${{ steps.meta.outputs.name }} ${{ steps.bump.outputs.version }}" \
            --generate-notes \
            --target "${{ steps.commit.outputs.sha }}"

      # 版本號是推到 main 的，dev 不會自己拿到，下一輪就從「落後一個 commit」開始。
      # 剛合併完的 main 一定包含 dev 的內容，所以這通常是純 fast-forward。
      #
      # **失敗不算發佈失敗**：套件已經上架、標籤已經建好，這一步只是省掉一次手動
      # 同步。發佈期間有人推 dev 就會推不動，那時手動 `git push origin main:dev`
      # 即可，所以這裡只警告不中斷。
      #
      # The bump lands on main; dev would otherwise start the next round one
      # commit behind. Right after the merge main contains dev, so this is
      # normally a plain fast-forward.
      #
      # **A failure here is not a failed release**: the package is published and
      # the tag exists, and this step only saves a manual sync. It cannot push if
      # someone commits to dev mid-release, which is what `git push origin
      # main:dev` afterwards is for - so it warns rather than failing the job.
      - name: Fast-forward dev to the released main
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git push origin "${{ steps.commit.outputs.sha }}:refs/heads/dev"; then
            echo "::notice::dev fast-forwarded to the released commit."
          else
            echo "::warning::Could not fast-forward dev - it moved during the release. Run 'git push origin main:dev' once the two are reconciled."
          fi
