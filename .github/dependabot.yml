# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/" # Location of package manifests
    # Work flows feature -> dev -> main and only the last step publishes, so
    # updates belong on dev; a PR opened against main just sits there.
    target-branch: "dev"
    schedule:
      interval: "daily"
    # A new release waits 7 days before Dependabot proposes it, so a
    # compromised version is more likely to be found and yanked first.
    # Dependabot's own default is 3 days. Security updates are not delayed.
    cooldown:
      default-days: 7
  # Workflow actions are pinned to commit SHAs with the version as a comment
  # (test_workflow_actions.py); Dependabot moves both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
