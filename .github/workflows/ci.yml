name: CI

# 注意：本檔刻意不放 schedule 觸發。GitHub 會在專案閒置約 60 天後自動停用「含排程的
# workflow」，那會連 push / pull_request 的檢查一起停掉（曾實際發生）。排程改放在
# nightly.yml，它再呼叫本 workflow；就算 nightly 被停用，PR 與 push 的 CI 仍會照跑。
#
# NOTE: no `schedule:` trigger here on purpose. GitHub disables workflows that
# contain a schedule after ~60 days of repository inactivity, which takes the
# push/pull_request checks down with it (this happened). The cron lives in
# nightly.yml and calls this workflow instead, so PR and push CI keep running
# even if the nightly one is disabled.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:
  # 手動觸發，用來驗證任何一個分支。需要它是因為 `[skip ci]` 的 commit 會讓
  # 分支停在「沒有 CI 紀錄」的狀態：版本號那筆與進度記錄那筆都帶 [skip ci]，
  # dev 因此曾經停在一個從未被 CI 跑過的 HEAD 上，而且沒有辦法補跑。
  # Manual runs, to verify any branch on demand. Needed because a `[skip ci]`
  # commit leaves a branch with no CI record: the version bump and the progress
  # log both carry it, which once left dev sitting on a HEAD that CI had never
  # run against and no way to ask for one.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r dev_requirements.txt

      - name: Compile package
        run: python -m compileall -q frontengine

      - name: Run unit tests
        run: python -m pytest tests/ -q

      # 啟動測試要用「這份 checkout 打包出來的套件」，不是 PyPI 上的版本。
      # 之前 dev_requirements 會裝下published 的 frontengine，而啟動腳本從自己的
      # 目錄執行，import 就落到 site-packages——等於在測已發布的版本，PR 改了什麼
      # 都測不到。少一個 __init__.py 會讓整個子套件不被打包，就是這樣漏過去的。
      #
      # The start-up checks must run against the package built from THIS
      # checkout, not the one on PyPI. dev_requirements used to install the
      # published frontengine, and the start scripts run from their own
      # directory, so the import landed in site-packages: the checks validated
      # the released version and never the pull request. A missing __init__.py
      # drops a whole sub-package from the wheel, which is how one slipped past.
      - name: Install the built package
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
          python -m pip install --no-deps --force-reinstall (Get-ChildItem dist/*.whl).FullName

      - name: Start FrontEngine
        run: python ./tests/unit_test/start/start_front_engine.py

      - name: Extend FrontEngine
        run: python ./tests/unit_test/start/extend_front_engine.py
