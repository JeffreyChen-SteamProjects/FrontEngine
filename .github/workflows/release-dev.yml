name: Release Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read project metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          TAG="dev-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${NAME} ${VERSION} as ${TAG}"

      - name: Check if tag already exists
        id: tag_check
        shell: bash
        run: |
          if git rev-parse "refs/tags/${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.meta.outputs.tag }} already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tooling
        if: steps.tag_check.outputs.exists == 'false'
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist + wheel
        if: steps.tag_check.outputs.exists == 'false'
        run: python -m build

      - name: Verify distributions
        if: steps.tag_check.outputs.exists == 'false'
        run: python -m twine check dist/*

      - name: Upload distributions artifact
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: dist-dev-${{ steps.meta.outputs.version }}
          path: dist/
          retention-days: 14

      - name: Twine upload to PyPI
        if: steps.tag_check.outputs.exists == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_DEV_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*

      - name: Create GitHub prerelease
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            dist/* \
            --title "${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }} (dev)" \
            --generate-notes \
            --prerelease \
            --target "${{ github.sha }}"
