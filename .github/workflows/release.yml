name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version segment to bump"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only fire when the PR actually merged (a closed-without-merge PR must not publish).
    # workflow_dispatch is allowed through so the flow can be re-run manually.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump version in stable.toml / pyproject.toml
        id: bump
        shell: bash
        env:
          BUMP_TYPE: ${{ inputs.bump || 'patch' }}
        run: |
          python - <<'PY'
          import os, pathlib, re

          bump_type = os.environ.get("BUMP_TYPE", "patch").lower()
          if bump_type not in {"patch", "minor", "major"}:
              raise SystemExit(f"Invalid bump type: {bump_type}")

          stable = pathlib.Path("stable.toml")
          text = stable.read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit("No semver version line found in stable.toml")
          major, minor, patch = (int(x) for x in match.groups())

          if bump_type == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump_type == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          new_version = f"{major}.{minor}.{patch}"

          stable.write_text(
              re.sub(
                  r'(^version\s*=\s*)"\d+\.\d+\.\d+"',
                  rf'\1"{new_version}"',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              ),
              encoding="utf-8",
          )

          pyproject = pathlib.Path("pyproject.toml")
          if pyproject.exists():
              pp_text = pyproject.read_text(encoding="utf-8")
              pyproject.write_text(
                  re.sub(
                      r'(^version\s*=\s*)"\d+\.\d+\.\d+"',
                      rf'\1"{new_version}"',
                      pp_text,
                      count=1,
                      flags=re.MULTILINE,
                  ),
                  encoding="utf-8",
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={new_version}\n")
              fh.write(f"tag=v{new_version}\n")
          print(f"::notice::Bumped to {new_version} ({bump_type})")
          PY

      - name: Check if tag already exists
        id: tag_check
        shell: bash
        run: |
          if git rev-parse "refs/tags/${{ steps.bump.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.bump.outputs.tag }} already exists — aborting to avoid republishing."
            exit 1
          fi

      - name: Commit version bump to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stable.toml pyproject.toml
          git commit -m "Bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin main

      - name: Swap in stable project metadata for build
        run: cp stable.toml pyproject.toml

      - name: Read project name
        id: meta
        shell: bash
        run: |
          NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      # 建置工具釘版本：發佈流程不該因為上游今天推了新版就跟著改行為。
      # Pin the build tooling: a publish must not change behaviour because an
      # upstream release happened to land today.
      - name: Install build tooling
        run: python -m pip install --upgrade pip "build==1.4.2" "twine==6.2.0"

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify distributions
        run: python -m twine check dist/*

      - name: Upload distributions artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.bump.outputs.version }}
          path: dist/
          retention-days: 90

      - name: Twine upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            dist/* \
            --title "${{ steps.meta.outputs.name }} ${{ steps.bump.outputs.version }}" \
            --generate-notes \
            --target main
